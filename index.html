<head>

<title>2026 MLB Postseason Leaders</title>
<style>
:root {
  color-scheme: dark;
  --bg:#0c1420; --panel:#142133; --border:#2a3a50;
  --text:#eef3fa; --muted:#a9b8cc; --accent:#57b5ff;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
main { max-width:1600px; margin:auto; padding:28px 20px; }
h1 { margin:6px 0 10px; font-size:clamp(24px,4vw,36px); }
.brand { color:var(--accent); font-size:12px; font-weight:bold;
         letter-spacing:2px; }
.subtitle { color:var(--muted); font-size:14px; line-height:1.6; }
.tabs { display:flex; gap:8px; margin:24px 0 16px; }
button,select,input {
  font:inherit; border:1px solid var(--border);
  border-radius:8px; background:var(--panel); color:var(--text);
}
button { padding:10px 18px; cursor:pointer; }
button.active { background:var(--accent); color:#081523;
                border-color:var(--accent); font-weight:bold; }
button:focus-visible,input:focus-visible,select:focus-visible {
  outline:2px solid var(--accent); outline-offset:3px;
}
.filters { display:flex; gap:14px; flex-wrap:wrap; align-items:end; }
label { display:flex; flex-direction:column; gap:7px;
        font-size:13px; color:var(--muted); }
input,select { padding:11px 12px; min-height:42px; }
input { width:min(330px,80vw); }
select { min-width:160px; }
.summary { margin:18px 0 10px; color:var(--muted); font-size:13px; }
.table-wrap {
  overflow:auto; max-height:75vh; border:1px solid var(--border);
  border-radius:10px;
}
table { width:100%; border-collapse:separate; border-spacing:0;
        font-size:13px; white-space:nowrap; }
th,td { padding:11px 12px; text-align:right;
        border-bottom:1px solid var(--border); }
thead th { position:sticky; top:0; background:#20324a; z-index:2; }
th button {
  border:0; padding:0; background:transparent; border-radius:0;
  font-size:12px; font-weight:bold; color:var(--text);
}
td:first-child,th:first-child { text-align:left; }
td:first-child { font-weight:bold; }
tbody tr:nth-child(even) { background:#111d2d; }
tbody tr:hover { background:#20324a; }
.empty { text-align:center!important; padding:35px; color:var(--muted); }
.note { color:var(--muted); font-size:12px; line-height:1.7; margin-top:14px; }
</style>
</head>

l", "Player": "Tyler Davis", "MLBAMID": 699823, "Team": "CWS", "Opponent": "CLE", "HomeAway": "home", "Position": "P", "GS": 0, "W": 0, "L": 0, "SV": 0, "HLD": 0, "BS": 0, "H": 1, "R": 0, "ER": 0, "HR": 0, "BB": 1, "IBB": 0, "SO": 1, "HBP": 0, "BF": 8, "Pitches": 27, "Strikes": 19, "WP": 0, "BK": 0, "Outs": 6}]}</script>
<script>
const data = JSON.parse(
  document.getElementById("leaderboardData").textContent
);

// Add derived game-level stats without changing the Python dataframes.
function rate(numerator, denominator) {
  return denominator > 0 ? numerator / denominator : null;
}

data.hitterLogs.forEach(row => {
  row["1B"] = row.H - row["2B"] - row["3B"] - row.HR;
  const totalBases =
    row["1B"] + 2*row["2B"] + 3*row["3B"] + 4*row.HR;

  row.AVG = rate(row.H, row.AB);
  row.OBP = rate(
    row.H + row.BB + row.HBP,
    row.AB + row.BB + row.HBP + row.SF
  );
  row.SLG = rate(totalBases, row.AB);
  row.OPS = row.OBP != null && row.SLG != null
    ? row.OBP + row.SLG : null;
});

data.pitcherLogs.forEach(row => {
  const outs = Number(row.Outs || 0);
  row.IP = `${Math.floor(outs/3)}.${outs%3}`;
  row.ERA = rate(27*row.ER, outs);
  row.WHIP = rate(3*(row.H + row.BB), outs);
});

const columns = {
  hitting: [
    "Player","Team","G","PA","AB","R","H","1B","2B","3B","HR","RBI",
    "BB","IBB","SO","HBP","SB","CS","SF","SH","GIDP","TB",
    "AVG","OBP","SLG","OPS","ISO","BABIP","BB%","K%"
  ],
  pitching: [
    "Player","Team","G","GS","W","L","SV","HLD","BS","IP",
    "H","R","ER","HR","BB","IBB","SO","HBP","BF","Pitches",
    "Strikes","WP","BK","ERA","WHIP","K/9","BB/9","H/9",
    "HR/9","K/BB","K%","BB%"
  ],
  hitterLogs: [
    "Player","Team","game_date","Opponent","HomeAway","round","status",
    "PA","AB","R","H","1B","2B","3B","HR","RBI",
    "BB","IBB","SO","HBP","SB","CS","SF","SH","GIDP",
    "AVG","OBP","SLG","OPS"
  ],
  pitcherLogs: [
    "Player","Team","game_date","Opponent","HomeAway","round","status",
    "GS","W","L","SV","HLD","BS","IP",
    "H","R","ER","HR","BB","IBB","SO","HBP","BF",
    "Pitches","Strikes","WP","BK","ERA","WHIP"
  ]
};

const labels = {
  game_date: "Date",
  HomeAway: "Home/Away",
  round: "Round",
  status: "Status"
};

const precision = {
  AVG:3, OBP:3, SLG:3, OPS:3, ISO:3, BABIP:3, WHIP:3,
  ERA:2, "K/9":2, "BB/9":2, "H/9":2, "HR/9":2, "K/BB":2,
  "BB%":1, "K%":1
};

const textColumns = new Set([
  "Player","Team","game_date","Opponent","HomeAway","round","status"
]);

const modes = ["hitting","pitching","hitterLogs","pitcherLogs"];

let mode = "hitting";
let sortKey = "HR";
let sortAscending = false;

const teamFilter = document.getElementById("teamFilter");
const playerSearch = document.getElementById("playerSearch");
const head = document.getElementById("tableHead");
const body = document.getElementById("tableBody");

function normalize(value) {
  return String(value ?? "").normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"").toLowerCase();
}

function teamsFor(row) {
  return String(row.Team ?? "").split("/").filter(Boolean);
}

function populateTeams() {
  const selected = teamFilter.value;
  const teams = [...new Set(data[mode].flatMap(teamsFor))].sort();

  teamFilter.replaceChildren(new Option("All teams",""));
  teams.forEach(team => teamFilter.add(new Option(team,team)));
  teamFilter.value = teams.includes(selected) ? selected : "";
}

function valueForSort(row, key) {
  if (key === "IP") {
    if (row.Outs != null) return Number(row.Outs);
    const [innings, outs="0"] = String(row.IP ?? "0.0").split(".");
    return Number(innings)*3 + Number(outs);
  }
  return row[key];
}

function formatValue(value,key) {
  if (value == null) return "—";
  if (key === "IP") return String(value);
  if (key in precision) return Number(value).toFixed(precision[key]);
  return String(value);
}

function render() {
  const query = normalize(playerSearch.value.trim());
  const team = teamFilter.value;
  const visibleColumns = columns[mode];
  const isLogs = mode === "hitterLogs" || mode === "pitcherLogs";

  const rows = data[mode].filter(row =>
    (!team || teamsFor(row).includes(team)) &&
    (!query || normalize(row.Player).includes(query))
  );

  rows.sort((a,b) => {
    const av = valueForSort(a,sortKey);
    const bv = valueForSort(b,sortKey);

    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;

    const comparison = textColumns.has(sortKey)
      ? String(av).localeCompare(String(bv))
      : Number(av)-Number(bv);

    return (sortAscending ? comparison : -comparison) ||
      String(a.Player ?? "").localeCompare(String(b.Player ?? "")) ||
      Number(a.game_pk ?? 0)-Number(b.game_pk ?? 0);
  });

  head.replaceChildren();
  const headerRow = document.createElement("tr");

  visibleColumns.forEach(key => {
    const th = document.createElement("th");
    th.scope = "col";

    if (key === sortKey) {
      th.setAttribute(
        "aria-sort", sortAscending ? "ascending" : "descending"
      );
    }

    const button = document.createElement("button");
    button.textContent = (labels[key] || key) + (
      key === sortKey ? (sortAscending ? " ▲" : " ▼") : ""
    );
    button.setAttribute("aria-label","Sort by " + (labels[key] || key));

    button.addEventListener("click",() => {
      if (sortKey === key) {
        sortAscending = !sortAscending;
      } else {
        sortKey = key;
        sortAscending =
          (textColumns.has(key) && key !== "game_date") ||
          ["ERA","WHIP","BB/9","HR/9"].includes(key);
      }
      render();
    });

    th.append(button);
    headerRow.append(th);
  });

  head.append(headerRow);
  body.replaceChildren();

  if (!rows.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = visibleColumns.length;
    td.className = "empty";
    td.textContent = "No records match these filters.";
    tr.append(td);
    body.append(tr);
  } else {
    const fragment = document.createDocumentFragment();

    rows.forEach(row => {
      const tr = document.createElement("tr");

      visibleColumns.forEach(key => {
        const td = document.createElement("td");
        td.textContent = formatValue(row[key],key);
        if (textColumns.has(key)) td.style.textAlign = "left";
        tr.append(td);
      });

      fragment.append(tr);
    });

    body.append(fragment);
  }

  const uniquePlayers = new Set(rows.map(row => row.MLBAMID)).size;

  document.getElementById("summary").textContent =
    `${rows.length} of ${data[mode].length} ` +
    `${isLogs ? "player-game records" : "players"} · ` +
    (isLogs ? `${uniquePlayers} players · ` : "") +
    `Sorted by ${labels[sortKey] || sortKey} ` +
    `(${sortAscending ? "ascending" : "descending"})`;
}

function setMode(nextMode) {
  mode = nextMode;
  sortKey = mode === "hitting" ? "HR"
    : mode === "pitching" ? "SO" : "game_date";
  sortAscending = false;

  modes.forEach(tab => {
    const button = document.getElementById(tab+"Tab");
    button.classList.toggle("active",tab === mode);
    button.setAttribute("aria-pressed",String(tab === mode));
  });

  populateTeams();
  render();
}

modes.forEach(tab => {
  document.getElementById(tab+"Tab")
    .addEventListener("click",() => setMode(tab));
});

teamFilter.addEventListener("change",render);
playerSearch.addEventListener("input",render);

document.getElementById("reset").addEventListener("click",() => {
  teamFilter.value = "";
  playerSearch.value = "";
  render();
});

populateTeams();
render();
</script></body>
